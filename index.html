<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☔ 降雨對照表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
  :root {
    --bg:#f4f6fb;--surface:#ffffff;--surface2:#eef1f8;--border:#dde3f0;
    --accent:#2f6fed;--accent2:#7c5cfc;--text:#1c2333;--muted:#66708a;--green:#059669;--red:#e11d48;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:20px 16px 40px}
  header{text-align:center;margin-bottom:24px}
  .title{font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
  .subtitle{font-size:.8rem;color:var(--muted);font-family:'JetBrains Mono',monospace}
  .date-badge{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:4px 14px;font-size:.75rem;color:var(--accent);font-family:'JetBrains Mono',monospace;margin-top:10px}
  .btn-refresh{display:flex;align-items:center;gap:8px;margin:16px auto 8px;padding:10px 24px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;color:#fff;font-family:'Noto Sans TC',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:opacity .2s,transform .1s}
  .btn-refresh:hover{opacity:.85}
  .btn-refresh:active{transform:scale(.97)}
  .btn-refresh:disabled{opacity:.5;cursor:not-allowed}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
  .loading .spinner{display:block}
  .loading .btn-icon{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status-msg{text-align:center;font-size:.78rem;color:var(--muted);margin-bottom:18px;min-height:18px;font-family:'JetBrains Mono',monospace}
  .status-msg.ok{color:var(--green)}
  .status-msg.error{color:var(--red)}

  .section-title{font-size:.9rem;font-weight:700;color:var(--accent);font-family:'JetBrains Mono',monospace;margin:24px 0 8px 4px;letter-spacing:.05em}
  .section-divider{border:none;border-top:1px solid var(--border);margin:28px 0}

  .day-section{margin-bottom:20px}
  .day-label{font-size:.82rem;font-weight:700;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:6px;padding-left:2px}

  .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);background:var(--surface)}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  thead tr{background:var(--surface2)}
  th{padding:10px 8px;font-weight:700;text-align:center;font-size:.78rem;letter-spacing:.05em;border-bottom:2px solid var(--border);white-space:nowrap}
  th.time-col{color:var(--muted);font-family:'JetBrains Mono',monospace}
  th.loc{color:var(--accent)}
  tbody tr{border-bottom:1px solid var(--border);transition:background .15s}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:var(--surface2)}
  .now-row{background:rgba(47,111,237,.07)!important;border-left:3px solid var(--accent)}
  .now-row td.time-cell{color:var(--accent);font-weight:700}
  td{padding:8px 6px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:.8rem}
  td.time-cell{color:var(--muted);font-weight:600;white-space:nowrap}
  .rain-cell{border-radius:6px;font-weight:600;padding:7px 4px;min-width:48px;display:block;margin:0 auto}

  .ai-report{background:linear-gradient(135deg,rgba(47,111,237,.07),rgba(124,92,252,.07));border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:20px}
  .ai-report-title{font-size:.82rem;font-weight:700;color:var(--accent);margin-bottom:8px;font-family:'JetBrains Mono',monospace;letter-spacing:.05em}
  .ai-recommend{font-size:1rem;font-weight:700;color:var(--green);margin-bottom:2px}
  .ai-reason{font-size:.82rem;color:var(--text);line-height:1.6;margin-bottom:6px}
  .ai-avoid{font-size:.85rem;font-weight:700;color:var(--red);margin-bottom:6px}
  .ai-avoid:empty{display:none;margin:0}
  .ai-time{font-size:.8rem;line-height:1.6;color:var(--text);margin-bottom:6px}
  .ai-tip{font-size:.78rem}
  .ai-tip summary{cursor:pointer;color:var(--accent);font-weight:600}
  .ai-tip[hidden]{display:none}
  .ai-tip div{margin-top:6px;line-height:1.8;color:var(--text);font-family:'JetBrains Mono',monospace}

  /* CCTV 即時校正區 */
  .cctv-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:20px}
  .cctv-section-title{font-size:.82rem;font-weight:700;color:var(--accent2);margin-bottom:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.05em}
  .cctv-note{font-size:.72rem;color:var(--muted);margin-bottom:10px;line-height:1.5}
  .cctv-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
  .cctv-loc{font-size:.8rem;font-weight:700;color:var(--text);min-width:28px;font-family:'JetBrains Mono',monospace}
  .cctv-btn{padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--muted);font-size:.72rem;cursor:pointer;transition:all .15s;font-family:'Noto Sans TC',sans-serif;white-space:nowrap}
  .cctv-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .cctv-btn.active.dry{background:#d1fae5;border-color:#059669;color:#065f46}
  .cctv-btn.active.unknown{background:var(--surface2);border-color:var(--muted);color:var(--muted)}
  .cctv-btn.active.wet{background:#fef3c7;border-color:#d97706;color:#92400e}
  .cctv-btn.active.raining{background:#fee2e2;border-color:#e11d48;color:#9f1239}
  .cctv-links{font-size:.72rem;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
  .cctv-links a{color:var(--accent);text-decoration:none;margin-right:8px}
  .cctv-weight-note{font-size:.7rem;color:var(--muted);margin-top:4px;font-style:italic}

  .legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px;font-size:.72rem;color:var(--muted)}
  .legend-item{display:flex;align-items:center;gap:5px}
  .legend-dot{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.08)}
  .source-note{text-align:center;margin-top:24px;font-size:.68rem;color:var(--muted);font-family:'JetBrains Mono',monospace;line-height:1.8}
  .source-note a{color:var(--accent);text-decoration:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<header>
  <div class="title">☔ 降雨機率對照表</div>
  <div class="subtitle">嘉義・雲林 六地 · 中央氣象署</div>
  <div class="date-badge" id="dateBadge">載入中…</div>
</header>

<button class="btn-refresh" id="refreshBtn" onclick="fetchAll()">
  <span class="btn-icon">⟳</span>
  <span class="spinner"></span>
  重新整理
</button>
<div class="status-msg" id="statusMsg">自動載入中…</div>

<!-- 🚗 出門建議決策卡（directionAdvisor）：以生活圈權重 × 現在降雨率排序推薦/避免方向 -->
<div class="ai-report" id="aiReport">
  <div class="ai-report-title">🚗 今日出門建議</div>
  <div class="ai-recommend" id="ai-recommend">載入中…</div>
  <div class="ai-reason" id="ai-reason"></div>
  <div class="ai-avoid" id="ai-avoid"></div>
  <div class="ai-time" id="ai-report-time"></div>
  <details class="ai-tip" id="ai-tip-wrap" hidden>
    <summary>查看各方向即時降雨率</summary>
    <div id="ai-tip"></div>
  </details>
</div>

<!-- 📷 CCTV 即時降雨校正（手動設定，修正方向評分；不取代 CWA 預報） -->
<div class="cctv-section">
  <div class="cctv-section-title">📷 即時路況校正</div>
  <div class="cctv-note">請對照 CCTV 設定各方向現況，自動修正出門建議分數（CCTV 佔 20%，CWA 預報佔 80%）</div>
  <div id="cctvGrid"></div>
  <div class="cctv-links">
    快速查看監視器：
    <a href="https://1968.freeway.gov.tw/" target="_blank">🛣 國道監視器</a>
    <a href="https://www.mvdis.gov.tw/m3-emv-1968/cctv/index" target="_blank">🏞 省道監視器</a>
  </div>
  <div class="cctv-weight-note">* CCTV 為單點量測，僅供參考；夜間或鏡頭不清晰時建議設「不確定」</div>
</div>

<!-- 六地對照（24小時） -->
<div class="section-title">🗺 六地對照｜今天 + 明天</div>
<div id="mainContent"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#eef4fb"></div>&lt;40%</div>
  <div class="legend-item"><div class="legend-dot" style="background:#dbeafe"></div>40–69%</div>
  <div class="legend-item"><div class="legend-dot" style="background:#bfe3fb"></div>70–89%</div>
  <div class="legend-item"><div class="legend-dot" style="background:#fecdd3"></div>90%+</div>
</div>

<div class="source-note">
  資料來源：<a href="https://opendata.cwa.gov.tw/" target="_blank">中央氣象署</a> · 鄉鎮3小時降雨機率預報<br>
  新港鄉 · 民雄鄉 · 溪口鄉 · 北港鎮 · 朴子市 · 斗南鎮
</div>

<script>
const KEY = 'CWA-1D3F650A-CBDF-4BE9-9DE8-8869409AC7FD';

const LOCATIONS = [
  { name: '新港', county: 'F-D0047-029', town: '新港鄉' },
  { name: '民雄', county: 'F-D0047-029', town: '民雄鄉' },
  { name: '溪口', county: 'F-D0047-029', town: '溪口鄉' },
  { name: '北港', county: 'F-D0047-025', town: '北港鎮' },
  { name: '朴子', county: 'F-D0047-029', town: '朴子市' },
  { name: '斗南', county: 'F-D0047-025', town: '斗南鎮' },
];

// 舊命名相容：任何殘留的「大潭」字樣一律正規化顯示為「新港」
const LOCATION_ALIAS = {
  '大潭': '新港',
  '大潭（新港鄉）': '新港',
  '大潭(新港鄉)': '新港',
};
function getDisplayLocation(name) {
  return LOCATION_ALIAS[name] || name;
}

// 六地對照 24 小時：00:00～21:00（3小時一格）
const COMPARE_HOURS = ['00:00','03:00','06:00','09:00','12:00','15:00','18:00','21:00'];

// 方向評分資料來源：直接複用 fetchAll 已抓的 3h 資料集（029/025），不另發 API
// 好處：零額外請求、與主表同一資料批次、029/025 已驗證可用
const DIRECTION_TOWNS = {
  新港: { dataset: 'F-D0047-029', town: '新港鄉' },
  溪口: { dataset: 'F-D0047-029', town: '溪口鄉' },
  民雄: { dataset: 'F-D0047-029', town: '民雄鄉' },
  朴子: { dataset: 'F-D0047-029', town: '朴子市' },
  大林: { dataset: 'F-D0047-029', town: '大林鎮' },
  斗南: { dataset: 'F-D0047-025', town: '斗南鎮' },
  北港: { dataset: 'F-D0047-025', town: '北港鎮' },
};

// CCTV toggle 重算時用；fetchAll 成功後寫入
let cachedCountyData = {};

// 生活圈權重：越常去、越在意的方向權重越高（可依實際生活圈調整）
const DIRECTION_WEIGHTS = { 新港: 40, 溪口: 25, 斗南: 20, 民雄: 15, 朴子: 15, 大林: 10, 北港: 5 };

// CCTV 即時校正：手動設定現場狀況，換算為有效降雨率的微調（±10/20%）
// 佔最終分數 20%，保持 CWA 預報為主體
const CCTV_POP_ADJ = { dry: -10, unknown: 0, wet: +10, raining: +20 };
const CCTV_BTN_DEF = [
  { state: 'dry',     label: '☀ 乾燥',  cls: 'dry' },
  { state: 'unknown', label: '? 不確定', cls: 'unknown' },
  { state: 'wet',     label: '💧 路濕',  cls: 'wet' },
  { state: 'raining', label: '🌧 降雨',  cls: 'raining' },
];

// 存放各方向的 CCTV 狀態；sessionStorage 持久化（重新整理清空）
let cctvStates = {};
try { const s = sessionStorage.getItem('cctvStates'); if (s) cctvStates = JSON.parse(s); } catch(_) {}

function saveCctvStates() {
  try { sessionStorage.setItem('cctvStates', JSON.stringify(cctvStates)); } catch(_) {}
}

function setCctvState(label, state) {
  cctvStates[label] = state;
  saveCctvStates();
  renderCctvGrid();
  updateAiReport(cachedCountyData);
}

function renderCctvGrid() {
  const grid = document.getElementById('cctvGrid');
  if (!grid) return;
  grid.innerHTML = Object.keys(DIRECTION_WEIGHTS).map(label => {
    const cur = cctvStates[label] || 'unknown';
    const btns = CCTV_BTN_DEF.map(({ state, label: btnLabel, cls }) =>
      `<button class="cctv-btn ${cls} ${cur === state ? 'active' : ''}"
        onclick="setCctvState('${label}','${state}')">${btnLabel}</button>`
    ).join('');
    return `<div class="cctv-row"><span class="cctv-loc">${label}</span>${btns}</div>`;
  }).join('');
}

// 從 3h 資料集解析單一鄉鎮的時段陣列 [{start, end, value}]
// ElementName: '3小時降雨機率'  key: ProbabilityOfPrecipitation（與主表一致）
function parse3hSlots(locations, townName) {
  const loc = locations.find(l => l.LocationName === townName);
  if (!loc) return [];
  const we = loc.WeatherElement.find(e => e.ElementName === '3小時降雨機率');
  if (!we) return [];
  return we.Time
    .map(t => ({
      start: new Date(t.StartTime),
      end:   new Date(t.EndTime),
      value: parseInt(t.ElementValue[0].ProbabilityOfPrecipitation),
    }))
    .filter(t => !isNaN(t.value));
}

function getCurrentSlotValue(slots, now) {
  const slot = slots.find(s => now >= s.start && now < s.end);
  return slot ? slot.value : null;
}

// 未來 N 小時（不含目前這一格）
function getNearFutureSlots(slots, now, hoursAhead) {
  return slots.filter(s => s.start >= now).slice(0, hoursAhead);
}

// 規則式評分：分數 = (100 - 有效降雨率) × 生活圈權重
// 無資料 → score = -Infinity，排在最末，不參與推薦
function computeDirectionScores(townSlots, now) {
  return Object.entries(DIRECTION_WEIGHTS).map(([label, weight]) => {
    const slots = townSlots[label] || [];
    const currentPop = getCurrentSlotValue(slots, now); // null = 無資料
    if (currentPop === null) {
      return { label, weight, currentPop: null, effectivePop: null, nearFuture: [], score: -Infinity };
    }
    const nearFuture = getNearFutureSlots(slots, now, 2); // 2 × 3h = 看 6 小時
    const cctvAdj = CCTV_POP_ADJ[cctvStates[label] || 'unknown'];
    const cctvPop = Math.max(0, Math.min(100, currentPop + cctvAdj));
    const effectivePop = currentPop * 0.8 + cctvPop * 0.2;
    const score = (100 - effectivePop) * weight;
    return { label, weight, currentPop, cctvAdj, effectivePop: Math.round(effectivePop), nearFuture, score };
  }).sort((a, b) => b.score - a.score);
}

// 未來 2～3 小時內，推薦方向是否會轉為大雨（>=80%）
function findUpcomingSpike(recommend) {
  for (const r of recommend) {
    const spike = r.nearFuture.find(s => s.value >= 80);
    if (spike) return { label: r.label, spike };
  }
  return null;
}

// directionAdvisor：CWA 3h 資料 + 生活圈權重 → 推薦/避免方向 + 未來雨勢提醒
// 無資料鄉鎮不參與排序；全部無資料則回傳空結果
function directionAdvisor(townSlots, now) {
  const scores = computeDirectionScores(townSlots, now);
  const withData = scores.filter(s => s.currentPop !== null);

  if (withData.length === 0) {
    return { scores, noData: true, recommendLabel: '', reasonText: '', avoidText: '', warning: null };
  }

  const recommend = withData.slice(0, 2);
  const avoid = withData[withData.length - 1];
  const upcoming = findUpcomingSpike(recommend);

  let warning = null;
  if (upcoming) {
    const deadline = new Date(upcoming.spike.start.getTime() - 3600 * 1000);
    const deadlineText = deadline > now ? `${pad(deadline.getHours())}:00 前` : '盡快';
    warning = `⚠️ 預計 <strong>${pad(upcoming.spike.start.getHours())}:00</strong>，${upcoming.label}降雨率將達 ${upcoming.spike.value}%，建議${deadlineText}出門`;
  }

  function cctvTag(r) {
    const s = cctvStates[r.label];
    if (!s || s === 'unknown') return '';
    const icons = { dry: '☀', wet: '💧', raining: '🌧' };
    return ` ${icons[s] || ''}`;
  }

  return {
    scores,
    noData: false,
    recommendLabel: recommend.map(r => r.label).join('／') + '方向',
    reasonText: '原因：' + recommend.map(r => {
      const adj = r.cctvAdj !== 0 ? `→${r.effectivePop}%校正` : '';
      return `${r.label} ${r.currentPop}%${adj}${cctvTag(r)}`;
    }).join('　'),
    avoidText: avoid.effectivePop >= 50 ? `🚫 避免：${avoid.label}方向（${avoid.currentPop}%）` : '',
    warning,
  };
}

// countyData = { 'F-D0047-029': [...chiayi locs], 'F-D0047-025': [...yunlin locs] }
// 由 fetchAll 傳入；CCTV toggle 用 cachedCountyData
function updateAiReport(countyData) {
  const recommendEl = document.getElementById('ai-recommend');
  const reasonEl = document.getElementById('ai-reason');
  const avoidEl = document.getElementById('ai-avoid');
  const timeEl = document.getElementById('ai-report-time');
  const tipWrap = document.getElementById('ai-tip-wrap');
  const tipEl = document.getElementById('ai-tip');

  try {
    const now = new Date();
    const townSlots = {};
    for (const [label, cfg] of Object.entries(DIRECTION_TOWNS)) {
      const locs = countyData?.[cfg.dataset] || [];
      townSlots[label] = parse3hSlots(locs, cfg.town);
    }

    const advice = directionAdvisor(townSlots, now);

    if (advice.noData) {
      recommendEl.textContent = '⚠ 降雨資料未載入';
      reasonEl.textContent = '請稍後重新整理';
      avoidEl.textContent = '';
      timeEl.textContent = '';
      tipWrap.hidden = true;
      return;
    }

    recommendEl.textContent = `🟢 推薦：${advice.recommendLabel}`;
    reasonEl.textContent = advice.reasonText;
    avoidEl.textContent = advice.avoidText;
    timeEl.innerHTML = advice.warning || '📊 未來 6 小時對流平穩，暫無突發大雨';

    const cctvIcons = { dry: ' ☀', unknown: '', wet: ' 💧', raining: ' 🌧' };
    tipEl.innerHTML = advice.scores
      .map(s => {
        if (s.currentPop === null) {
          return `${s.label}　<span style="color:var(--muted)">—</span>`;
        }
        const cState = cctvStates[s.label] || 'unknown';
        const cctvStr = cState !== 'unknown' ? cctvIcons[cState] : '';
        const adjStr = s.cctvAdj !== 0 ? `→<strong>${s.effectivePop}%</strong>` : '';
        return `${s.label}　${s.currentPop}%${adjStr}${cctvStr}`;
      })
      .join('<br>');
    tipWrap.hidden = false;
  } catch (e) {
    console.error('[updateAiReport]', e);
    recommendEl.textContent = '⚠ 資料處理失敗';
    reasonEl.textContent = e.message;
    avoidEl.textContent = '';
    timeEl.textContent = '';
    tipWrap.hidden = true;
  }
}

function getRainColor(pct) {
  if (pct === null) return { bg: '#eef1f8', text: '#94a0b8' };
  if (pct >= 90) return { bg: '#fecdd3', text: '#9f1239' };
  if (pct >= 70) return { bg: '#bfe3fb', text: '#075985' };
  if (pct >= 40) return { bg: '#dbeafe', text: '#1d4ed8' };
  return { bg: '#eef4fb', text: '#7c8aa8' };
}

function pad(n) { return String(n).padStart(2,'0'); }

function setStatus(msg, type='') {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
}

function setLoading(on) {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = on;
  btn.classList.toggle('loading', on);
}

function updateDateBadge() {
  const now = new Date();
  document.getElementById('dateBadge').textContent =
    `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())} 更新`;
}

// 通用 fetch：解析 CWA Location 陣列（相容大/小寫 Locations 結構）
function extractLocations(rec) {
  if (rec.Locations?.[0]?.Location) return rec.Locations[0].Location;
  if (rec.locations?.[0]?.location) return rec.locations[0].location;
  if (Array.isArray(rec.Location)) return rec.Location;
  return null;
}

async function fetchCounty(code) {
  const res = await fetch(`https://opendata.cwa.gov.tw/api/v1/rest/datastore/${code}?Authorization=${KEY}`);
  if (!res.ok) throw new Error(`HTTP ${res.status} for ${code}`);
  const data = await res.json();
  const locs = extractLocations(data.records);
  if (!locs) {
    console.error('[fetchCounty] 未知回傳結構:', code, JSON.stringify(data.records).slice(0, 400));
    throw new Error('Unexpected response structure for ' + code);
  }
  return locs;
}


function parseLocationData(locations, townName) {
  const loc = locations.find(l => l.LocationName === townName);
  if (!loc) return {};
  const result = {};
  for (const we of loc.WeatherElement) {
    if (we.ElementName === '3小時降雨機率') {
      for (const t of we.Time) {
        const dt = t.StartTime;
        const dateKey = dt.slice(5,10);
        const timeKey = dt.slice(11,16);
        if (!result[dateKey]) result[dateKey] = {};
        result[dateKey][timeKey] = parseInt(t.ElementValue[0].ProbabilityOfPrecipitation);
      }
    }
  }
  return result;
}

function getDayLabel(dateStr) {
  const now = new Date();
  const [m, d] = dateStr.split('-').map(Number);
  const target = new Date(now.getFullYear(), m-1, d);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((target - today) / 86400000);
  const wd = ['日','一','二','三','四','五','六'][target.getDay()];
  const prefix = diff === 0 ? '今天' : diff === 1 ? '明天' : '';
  return `${prefix}・${m}/${d}（${wd}）`;
}

function makeTable(dateKey, hours, locNames, allData, currentDateKey, currentHour) {
  const rows = hours.map(h => {
    const isNow = dateKey === currentDateKey && h === currentHour;
    const cells = locNames.map(name => {
      const pct = allData[name]?.[dateKey]?.[h] ?? null;
      const { bg, text } = getRainColor(pct);
      const label = pct !== null ? `${pct}%` : '—';
      return `<td><span class="rain-cell" style="background:${bg};color:${text}">${label}</span></td>`;
    }).join('');
    return `<tr class="${isNow ? 'now-row' : ''}">
      <td class="time-cell">${h}${isNow ? ' ◀' : ''}</td>${cells}
    </tr>`;
  }).join('');

  const headers = locNames.map(n => `<th class="loc">${getDisplayLocation(n)}</th>`).join('');
  return `<div class="table-wrap"><table>
    <thead><tr><th class="time-col">時間</th>${headers}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderAll(allData) {
  const now = new Date();
  const currentDateKey = `${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const currentHour = `${pad(now.getHours())}:00`;

  // 今明兩天的 dateKey
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
  const todayKey = `${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  const tomorrowKey = `${pad(tomorrow.getMonth()+1)}-${pad(tomorrow.getDate())}`;
  const days = [todayKey, tomorrowKey];

  // 六地對照（24小時）
  const locNames = LOCATIONS.map(l => l.name);
  let mainHtml = '';
  for (const dk of days) {
    mainHtml += `<div class="day-section">
      <div class="day-label">📅 ${getDayLabel(dk)}</div>
      ${makeTable(dk, COMPARE_HOURS, locNames, allData, currentDateKey, currentHour)}
    </div>`;
  }
  document.getElementById('mainContent').innerHTML = mainHtml;
}

async function fetchAll() {
  setLoading(true);
  setStatus('抓取氣象署資料中…');
  updateDateBadge();

  try {
    const [chiayi, yunlin] = await Promise.all([
      fetchCounty('F-D0047-029'),
      fetchCounty('F-D0047-025'),
    ]);

    cachedCountyData = { 'F-D0047-029': chiayi, 'F-D0047-025': yunlin };

    const allData = {};
    for (const loc of LOCATIONS) {
      const locs = loc.county === 'F-D0047-029' ? chiayi : yunlin;
      allData[loc.name] = parseLocationData(locs, loc.town);
    }

    renderAll(allData);
    setStatus('✓ 資料已更新', 'ok');
  } catch(e) {
    console.error('[fetchAll]', e);
    setStatus('⚠ 抓取失敗，請重試', 'error');
  }

  updateAiReport(cachedCountyData);

  setLoading(false);
}

renderCctvGrid();
fetchAll();
</script>
