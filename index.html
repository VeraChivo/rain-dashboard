<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☔ 降雨對照表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
  :root {
    --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3350;
    --accent:#4f8ef7;--accent2:#7c5cfc;--text:#e2e8f0;--muted:#64748b;--green:#10b981;--red:#f43f5e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:20px 16px 40px}
  header{text-align:center;margin-bottom:24px}
  .title{font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
  .subtitle{font-size:.8rem;color:var(--muted);font-family:'JetBrains Mono',monospace}
  .date-badge{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:4px 14px;font-size:.75rem;color:var(--accent);font-family:'JetBrains Mono',monospace;margin-top:10px}
  .btn-refresh{display:flex;align-items:center;gap:8px;margin:16px auto 8px;padding:10px 24px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;color:#fff;font-family:'Noto Sans TC',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:opacity .2s,transform .1s}
  .btn-refresh:hover{opacity:.85}
  .btn-refresh:active{transform:scale(.97)}
  .btn-refresh:disabled{opacity:.5;cursor:not-allowed}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
  .loading .spinner{display:block}
  .loading .btn-icon{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status-msg{text-align:center;font-size:.78rem;color:var(--muted);margin-bottom:18px;min-height:18px;font-family:'JetBrains Mono',monospace}
  .status-msg.ok{color:var(--green)}
  .status-msg.error{color:var(--red)}

  .day-section{margin-bottom:24px}
  .day-label{font-size:.85rem;font-weight:700;color:var(--accent);font-family:'JetBrains Mono',monospace;margin-bottom:8px;padding-left:4px;letter-spacing:.05em}

  .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);background:var(--surface)}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  thead tr{background:var(--surface2)}
  th{padding:12px 10px;font-weight:700;text-align:center;font-size:.8rem;letter-spacing:.05em;border-bottom:2px solid var(--border);white-space:nowrap}
  th.time-col{color:var(--muted);font-family:'JetBrains Mono',monospace}
  th.loc{color:var(--accent)}
  tbody tr{border-bottom:1px solid var(--border);transition:background .15s}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:var(--surface2)}
  .now-row{background:rgba(79,142,247,.08)!important;border-left:3px solid var(--accent)}
  .now-row td.time-cell{color:var(--accent);font-weight:700}
  td{padding:10px 8px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:.82rem}
  td.time-cell{color:var(--muted);font-weight:600;white-space:nowrap}
  .rain-cell{border-radius:6px;font-weight:600;padding:8px 6px;min-width:52px;display:block;margin:0 auto}

  .legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px;font-size:.72rem;color:var(--muted)}
  .legend-item{display:flex;align-items:center;gap:5px}
  .legend-dot{width:12px;height:12px;border-radius:3px}
  .source-note{text-align:center;margin-top:28px;font-size:.68rem;color:var(--muted);font-family:'JetBrains Mono',monospace;line-height:1.8}
  .source-note a{color:var(--accent);text-decoration:none}

  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .skeleton .rain-cell{background:var(--surface2)!important;color:transparent!important;animation:pulse 1.2s ease-in-out infinite}
</style>
</head>
<body>
<header>
  <div class="title">☔ 降雨機率對照表</div>
  <div class="subtitle">嘉義・雲林 六地 · 氣象署官方資料</div>
  <div class="date-badge" id="dateBadge">載入中…</div>
</header>

<button class="btn-refresh" id="refreshBtn" onclick="fetchAll()">
  <span class="btn-icon">⟳</span>
  <span class="spinner"></span>
  重新整理
</button>
<div class="status-msg" id="statusMsg">自動載入中…</div>

<div id="mainContent"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#12243a"></div>&lt;40%</div>
  <div class="legend-item"><div class="legend-dot" style="background:#1e3a5f"></div>40–69%</div>
  <div class="legend-item"><div class="legend-dot" style="background:#0c4a6e"></div>70–89%</div>
  <div class="legend-item"><div class="legend-dot" style="background:#7f1d35"></div>90%+</div>
</div>

<div class="source-note">
  資料來源：<a href="https://opendata.cwa.gov.tw/" target="_blank">中央氣象署開放資料</a>｜鄉鎮3小時降雨機率預報<br>
  大潭（新港鄉）· 民雄鄉 · 溪口鄉 · 北港鎮 · 朴子市 · 斗南鎮
</div>

<script>
const KEY = 'CWA-1D3F650A-CBDF-4BE9-9DE8-8869409AC7FD';

const LOCATIONS = [
  { name: '大潭', county: 'F-D0047-029', town: '新港鄉' },
  { name: '民雄', county: 'F-D0047-029', town: '民雄鄉' },
  { name: '溪口', county: 'F-D0047-029', town: '溪口鄉' },
  { name: '北港', county: 'F-D0047-025', town: '北港鎮' },
  { name: '朴子', county: 'F-D0047-029', town: '朴子市' },
  { name: '斗南', county: 'F-D0047-025', town: '斗南鎮' },
];

// 顯示時段：每天 06:00 ~ 18:00（3小時一格）
const SHOW_HOURS = ['06:00','09:00','12:00','15:00','18:00'];

function getRainColor(pct) {
  if (pct === null) return { bg: '#1a1d27', text: '#64748b' };
  if (pct >= 90) return { bg: '#7f1d35', text: '#fda4af' };
  if (pct >= 70) return { bg: '#0c4a6e', text: '#7dd3fc' };
  if (pct >= 40) return { bg: '#1e3a5f', text: '#93c5fd' };
  return { bg: '#12243a', text: '#4a6080' };
}

function setStatus(msg, type = '') {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
}

function setLoading(on) {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = on;
  btn.classList.toggle('loading', on);
}

function pad(n) { return String(n).padStart(2,'0'); }

function updateDateBadge() {
  const now = new Date();
  document.getElementById('dateBadge').textContent =
    `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())} 更新`;
}

async function fetchCounty(code) {
  const url = `https://opendata.cwa.gov.tw/api/v1/rest/datastore/${code}?Authorization=${KEY}`;
  const res = await fetch(url);
  const data = await res.json();
  return data.records.Locations[0].Location;
}

function parseLocationData(locations, townName) {
  const loc = locations.find(l => l.LocationName === townName);
  if (!loc) return {};
  const result = {};
  for (const we of loc.WeatherElement) {
    if (we.ElementName === '3小時降雨機率') {
      for (const t of we.Time) {
        const dt = t.StartTime; // "2026-07-17T06:00:00+08:00"
        const dateKey = dt.slice(5,10);  // "07-17"
        const timeKey = dt.slice(11,16); // "06:00"
        if (!result[dateKey]) result[dateKey] = {};
        result[dateKey][timeKey] = parseInt(t.ElementValue[0].ProbabilityOfPrecipitation);
      }
    }
  }
  return result;
}

function getDayLabel(dateStr) {
  // dateStr = "07-17"
  const now = new Date();
  const year = now.getFullYear();
  const [m, d] = dateStr.split('-').map(Number);
  const target = new Date(year, m-1, d);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((target - today) / 86400000);
  const weekdays = ['日','一','二','三','四','五','六'];
  const wd = weekdays[target.getDay()];
  const prefix = diff === 0 ? '今天' : diff === 1 ? '明天' : diff === 2 ? '後天' : '';
  return `${prefix ? prefix + '・' : ''}${m}/${d}（${wd}）`;
}

function renderTable(allData) {
  const now = new Date();
  const currentDateKey = `${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const currentHour = `${pad(now.getHours())}:00`;

  // 收集所有日期
  const allDates = new Set();
  for (const locData of Object.values(allData)) {
    for (const dateKey of Object.keys(locData)) {
      allDates.add(dateKey);
    }
  }
  const sortedDates = Array.from(allDates).sort();

  let html = '';
  for (const dateKey of sortedDates) {
    const label = getDayLabel(dateKey);
    const rows = SHOW_HOURS.map(h => {
      const isNow = dateKey === currentDateKey && h === currentHour;
      const cells = LOCATIONS.map(loc => {
        const pct = allData[loc.name]?.[dateKey]?.[h] ?? null;
        const { bg, text } = getRainColor(pct);
        const label = pct !== null ? `${pct}%` : '—';
        return `<td><span class="rain-cell" style="background:${bg};color:${text}">${label}</span></td>`;
      }).join('');
      return `<tr class="${isNow ? 'now-row' : ''}">
        <td class="time-cell">${h}${isNow ? ' ◀' : ''}</td>
        ${cells}
      </tr>`;
    }).join('');

    html += `
      <div class="day-section">
        <div class="day-label">📅 ${label}</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="time-col">時間</th>
                ${LOCATIONS.map(l => `<th class="loc">${l.name}</th>`).join('')}
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }

  document.getElementById('mainContent').innerHTML = html;
}

async function fetchAll() {
  setLoading(true);
  setStatus('抓取氣象署資料中…');
  updateDateBadge();

  try {
    const [chiayi, yunlin] = await Promise.all([
      fetchCounty('F-D0047-029'),
      fetchCounty('F-D0047-025'),
    ]);

    const allData = {};
    for (const loc of LOCATIONS) {
      const countyData = loc.county === 'F-D0047-029' ? chiayi : yunlin;
      allData[loc.name] = parseLocationData(countyData, loc.town);
    }

    renderTable(allData);
    setStatus('✓ 資料已更新（中央氣象署）', 'ok');
  } catch(e) {
    setStatus('⚠ 抓取失敗，請重試', 'error');
    console.error(e);
  }

  setLoading(false);
}

fetchAll();
</script>
</body>
</html>
