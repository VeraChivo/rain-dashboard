<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☔ 降雨對照表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
  :root {
    --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3350;
    --accent:#4f8ef7;--accent2:#7c5cfc;--text:#e2e8f0;--muted:#64748b;--green:#10b981;--red:#f43f5e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:20px 16px 40px}
  header{text-align:center;margin-bottom:24px}
  .title{font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
  .subtitle{font-size:.8rem;color:var(--muted);font-family:'JetBrains Mono',monospace}
  .date-badge{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:4px 14px;font-size:.75rem;color:var(--accent);font-family:'JetBrains Mono',monospace;margin-top:10px}
  .btn-refresh{display:flex;align-items:center;gap:8px;margin:16px auto 8px;padding:10px 24px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;color:#fff;font-family:'Noto Sans TC',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:opacity .2s,transform .1s}
  .btn-refresh:hover{opacity:.85}
  .btn-refresh:active{transform:scale(.97)}
  .btn-refresh:disabled{opacity:.5;cursor:not-allowed}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
  .loading .spinner{display:block}
  .loading .btn-icon{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status-msg{text-align:center;font-size:.78rem;color:var(--muted);margin-bottom:18px;min-height:18px;font-family:'JetBrains Mono',monospace}
  .status-msg.ok{color:var(--green)}
  .status-msg.error{color:var(--red)}

  .section-title{font-size:.9rem;font-weight:700;color:var(--accent);font-family:'JetBrains Mono',monospace;margin:24px 0 8px 4px;letter-spacing:.05em}
  .section-divider{border:none;border-top:1px solid var(--border);margin:28px 0}

  .day-section{margin-bottom:20px}
  .day-label{font-size:.82rem;font-weight:700;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:6px;padding-left:2px}

  .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);background:var(--surface)}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  thead tr{background:var(--surface2)}
  th{padding:10px 8px;font-weight:700;text-align:center;font-size:.78rem;letter-spacing:.05em;border-bottom:2px solid var(--border);white-space:nowrap}
  th.time-col{color:var(--muted);font-family:'JetBrains Mono',monospace}
  th.loc{color:var(--accent)}
  tbody tr{border-bottom:1px solid var(--border);transition:background .15s}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:var(--surface2)}
  .now-row{background:rgba(79,142,247,.08)!important;border-left:3px solid var(--accent)}
  .now-row td.time-cell{color:var(--accent);font-weight:700}
  td{padding:8px 6px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:.8rem}
  td.time-cell{color:var(--muted);font-weight:600;white-space:nowrap}
  .rain-cell{border-radius:6px;font-weight:600;padding:7px 4px;min-width:48px;display:block;margin:0 auto}

  .ai-report{background:linear-gradient(135deg,rgba(79,142,247,.12),rgba(124,92,252,.12));border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:20px}
  .ai-report-title{font-size:.85rem;font-weight:700;color:var(--accent);margin-bottom:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.05em}
  .ai-report-block{font-size:.85rem;line-height:1.7;margin-bottom:8px}
  .ai-report-block:last-child{margin-bottom:0}
  .ai-report-block a{color:var(--accent)}

  .legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px;font-size:.72rem;color:var(--muted)}
  .legend-item{display:flex;align-items:center;gap:5px}
  .legend-dot{width:12px;height:12px;border-radius:3px}
  .source-note{text-align:center;margin-top:24px;font-size:.68rem;color:var(--muted);font-family:'JetBrains Mono',monospace;line-height:1.8}
  .source-note a{color:var(--accent);text-decoration:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<header>
  <div class="title">☔ 降雨機率對照表</div>
  <div class="subtitle">嘉義・雲林 六地 · 中央氣象署</div>
  <div class="date-badge" id="dateBadge">載入中…</div>
</header>

<button class="btn-refresh" id="refreshBtn" onclick="fetchAll()">
  <span class="btn-icon">⟳</span>
  <span class="spinner"></span>
  重新整理
</button>
<div class="status-msg" id="statusMsg">自動載入中…</div>

<!-- AI 出門建議快報：以朴子/新港/民雄/斗南當前1小時降雨率(PoP1h)判斷 -->
<div class="ai-report" id="aiReport">
  <div class="ai-report-title">🚗 出門建議快報</div>
  <div class="ai-report-block" id="ai-report-direction">載入中…</div>
  <div class="ai-report-block" id="ai-report-time">載入中…</div>
</div>

<!-- 大潭獨立區 -->
<div class="section-title">📍 大潭（新港鄉）24小時</div>
<div id="datanSection"></div>

<hr class="section-divider">

<!-- 六地對照 -->
<div class="section-title">🗺 六地對照｜今天 + 明天</div>
<div id="mainContent"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#12243a"></div>&lt;40%</div>
  <div class="legend-item"><div class="legend-dot" style="background:#1e3a5f"></div>40–69%</div>
  <div class="legend-item"><div class="legend-dot" style="background:#0c4a6e"></div>70–89%</div>
  <div class="legend-item"><div class="legend-dot" style="background:#7f1d35"></div>90%+</div>
</div>

<div class="source-note">
  資料來源：<a href="https://opendata.cwa.gov.tw/" target="_blank">中央氣象署</a> · 鄉鎮3小時降雨機率預報<br>
  大潭（新港鄉）· 民雄鄉 · 溪口鄉 · 北港鎮 · 朴子市 · 斗南鎮
</div>

<script>
const KEY = 'CWA-1D3F650A-CBDF-4BE9-9DE8-8869409AC7FD';

const LOCATIONS = [
  { name: '大潭', county: 'F-D0047-029', town: '新港鄉' },
  { name: '民雄', county: 'F-D0047-029', town: '民雄鄉' },
  { name: '溪口', county: 'F-D0047-029', town: '溪口鄉' },
  { name: '北港', county: 'F-D0047-025', town: '北港鎮' },
  { name: '朴子', county: 'F-D0047-029', town: '朴子市' },
  { name: '斗南', county: 'F-D0047-025', town: '斗南鎮' },
];

// 六地對照：06:00～23:00（3小時）
const COMPARE_HOURS = ['06:00','09:00','12:00','15:00','18:00','21:00'];

// 大潭24小時：00:00～21:00（3小時）
const DATAN_HOURS = ['00:00','03:00','06:00','09:00','12:00','15:00','18:00','21:00'];

// 逐小時降雨率 PoP1h 資料集（用於「出門建議快報」，涵蓋朴子/新港/民雄/斗南）
const HOURLY_COUNTY_CODES = { chiayi: 'F-D0047-062', yunlin: 'F-D0047-026' };
const HOURLY_TOWNS = {
  puzi:     { county: 'chiayi', town: '朴子市', label: '朴子' },
  xingang:  { county: 'chiayi', town: '新港鄉', label: '新港' },
  minxiong: { county: 'chiayi', town: '民雄鄉', label: '民雄' },
  dounan:   { county: 'yunlin', town: '斗南鎮', label: '斗南' },
};

function parseHourlyPop(locations, townName) {
  const loc = locations.find(l => l.LocationName === townName);
  if (!loc) return [];
  const we = loc.WeatherElement.find(e => e.ElementName === '1小時降雨機率');
  if (!we) return [];
  return we.Time.map(t => ({
    start: new Date(t.StartTime),
    end: new Date(t.EndTime),
    value: parseInt(t.ElementValue[0].ProbabilityOfPrecipitation),
  })).filter(t => !isNaN(t.value));
}

function getCurrentSlotValue(slots, now) {
  const slot = slots.find(s => now >= s.start && now < s.end);
  return slot ? slot.value : null;
}

function findHeavyRainSlot(townSlots, now) {
  let earliest = null;
  for (const { label, slots } of townSlots) {
    const hit = slots.find(s => s.start >= now && s.value >= 80);
    if (hit && (!earliest || hit.start < earliest.start)) {
      earliest = { label, start: hit.start };
    }
  }
  return earliest;
}

function buildDriveAdvice(puzi_pop, xingang_pop, minxiong_pop, dounan_pop) {
  if (minxiong_pop >= 70 && puzi_pop < 50) {
    return `🟢 <strong>能不能出門？</strong> 可以出門，但請注意方向！<br>
      🧭 <strong>方向建議</strong>：目前山邊對流劇烈，民雄、斗南正遭遇強降雨，<strong>不適合前往民雄與斗南</strong>！建議【往西南（太保/朴子）移動】，可前往免門票的【故宮南院兒童創意中心】室內避雨放電。<br>
      📺 <a href="https://tw.live" target="_blank">點我調閱朴子路面監視器確認乾濕</a>`;
  }
  if (puzi_pop >= 70 && minxiong_pop < 50) {
    return `🟢 <strong>能不能出門？</strong> 可以出門，但請注意方向！<br>
      🧭 <strong>方向建議</strong>：海區平原一帶目前正受對流影響，<strong>不適合前往朴子與新港</strong>！建議【往東北（大林）移動】，前往免門票的【丸聚星球觀光工廠】吃免費貢丸湯避雨。<br>
      📺 <a href="https://tw.live" target="_blank">點我調閱民雄路面監視器確認乾濕</a>`;
  }
  if (puzi_pop >= 70 && minxiong_pop >= 70) {
    return `❌ <strong>能不能出門？ ⚠️ 極不建議出門！</strong><br>
      🧭 <strong>方向建議</strong>：目前雲嘉六地全面籠罩在強降雨帶下，<strong>雙向皆不安全</strong>！極不建議騎車載 1.5 歲幼童外出，雨衣內悶熱且視線極差，請暫時留在室內避雨。`;
  }
  return `🟢 <strong>傳統大晴天/無明顯雨勢</strong>：目前雲嘉各鄉鎮降雨機率均低（均在 40% 以下），路面狀況良好，適合正常騎車外出！`;
}

function buildTimeAdvice(heavyRainSlot) {
  if (!heavyRainSlot) {
    return '📊 接下來數小時內對流平穩，暫無突發大暴雨預報。';
  }
  const formatted_time = `${pad(heavyRainSlot.start.getHours())}:00`;
  return `⚠️ <strong>關鍵暴雨時程</strong>：預報顯示 ${heavyRainSlot.label} 一帶在 <strong>${formatted_time}</strong> 左右對流會快速爆發，請務必在該時段前進入建築物或提早結束行程！`;
}

async function updateAiReport() {
  try {
    const [chiayiHourly, yunlinHourly] = await Promise.all([
      fetchCounty(HOURLY_COUNTY_CODES.chiayi),
      fetchCounty(HOURLY_COUNTY_CODES.yunlin),
    ]);
    const hourlyData = { chiayi: chiayiHourly, yunlin: yunlinHourly };

    const now = new Date();
    const townSlots = {};
    for (const [key, cfg] of Object.entries(HOURLY_TOWNS)) {
      townSlots[key] = parseHourlyPop(hourlyData[cfg.county], cfg.town);
    }

    const puzi_pop = getCurrentSlotValue(townSlots.puzi, now);
    const xingang_pop = getCurrentSlotValue(townSlots.xingang, now);
    const minxiong_pop = getCurrentSlotValue(townSlots.minxiong, now);
    const dounan_pop = getCurrentSlotValue(townSlots.dounan, now);

    document.getElementById('ai-report-direction').innerHTML =
      buildDriveAdvice(puzi_pop ?? 0, xingang_pop ?? 0, minxiong_pop ?? 0, dounan_pop ?? 0);

    const heavyRainSlot = findHeavyRainSlot(
      Object.entries(HOURLY_TOWNS).map(([key, cfg]) => ({ label: cfg.label, slots: townSlots[key] })),
      now
    );
    document.getElementById('ai-report-time').innerHTML = buildTimeAdvice(heavyRainSlot);
  } catch (e) {
    document.getElementById('ai-report-direction').innerHTML = '⚠ 無法取得即時降雨資料，暫無出門建議。';
    document.getElementById('ai-report-time').innerHTML = '';
  }
}

function getRainColor(pct) {
  if (pct === null) return { bg: '#1a1d27', text: '#64748b' };
  if (pct >= 90) return { bg: '#7f1d35', text: '#fda4af' };
  if (pct >= 70) return { bg: '#0c4a6e', text: '#7dd3fc' };
  if (pct >= 40) return { bg: '#1e3a5f', text: '#93c5fd' };
  return { bg: '#12243a', text: '#4a6080' };
}

function pad(n) { return String(n).padStart(2,'0'); }

function setStatus(msg, type='') {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
}

function setLoading(on) {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = on;
  btn.classList.toggle('loading', on);
}

function updateDateBadge() {
  const now = new Date();
  document.getElementById('dateBadge').textContent =
    `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())} 更新`;
}

async function fetchCounty(code) {
  const res = await fetch(`https://opendata.cwa.gov.tw/api/v1/rest/datastore/${code}?Authorization=${KEY}`);
  const data = await res.json();
  return data.records.Locations[0].Location;
}

function parseLocationData(locations, townName) {
  const loc = locations.find(l => l.LocationName === townName);
  if (!loc) return {};
  const result = {};
  for (const we of loc.WeatherElement) {
    if (we.ElementName === '3小時降雨機率') {
      for (const t of we.Time) {
        const dt = t.StartTime;
        const dateKey = dt.slice(5,10);
        const timeKey = dt.slice(11,16);
        if (!result[dateKey]) result[dateKey] = {};
        result[dateKey][timeKey] = parseInt(t.ElementValue[0].ProbabilityOfPrecipitation);
      }
    }
  }
  return result;
}

function getDayLabel(dateStr) {
  const now = new Date();
  const [m, d] = dateStr.split('-').map(Number);
  const target = new Date(now.getFullYear(), m-1, d);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((target - today) / 86400000);
  const wd = ['日','一','二','三','四','五','六'][target.getDay()];
  const prefix = diff === 0 ? '今天' : diff === 1 ? '明天' : '';
  return `${prefix}・${m}/${d}（${wd}）`;
}

function makeTable(dateKey, hours, locNames, allData, currentDateKey, currentHour) {
  const rows = hours.map(h => {
    const isNow = dateKey === currentDateKey && h === currentHour;
    const cells = locNames.map(name => {
      const pct = allData[name]?.[dateKey]?.[h] ?? null;
      const { bg, text } = getRainColor(pct);
      const label = pct !== null ? `${pct}%` : '—';
      return `<td><span class="rain-cell" style="background:${bg};color:${text}">${label}</span></td>`;
    }).join('');
    return `<tr class="${isNow ? 'now-row' : ''}">
      <td class="time-cell">${h}${isNow ? ' ◀' : ''}</td>${cells}
    </tr>`;
  }).join('');

  const headers = locNames.map(n => `<th class="loc">${n}</th>`).join('');
  return `<div class="table-wrap"><table>
    <thead><tr><th class="time-col">時間</th>${headers}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderAll(allData) {
  const now = new Date();
  const currentDateKey = `${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const currentHour = `${pad(now.getHours())}:00`;

  // 今明兩天的 dateKey
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
  const todayKey = `${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  const tomorrowKey = `${pad(tomorrow.getMonth()+1)}-${pad(tomorrow.getDate())}`;
  const days = [todayKey, tomorrowKey];

  // 大潭24小時
  let datanHtml = '';
  for (const dk of days) {
    datanHtml += `<div class="day-section">
      <div class="day-label">📅 ${getDayLabel(dk)}</div>
      ${makeTable(dk, DATAN_HOURS, ['大潭'], allData, currentDateKey, currentHour)}
    </div>`;
  }
  document.getElementById('datanSection').innerHTML = datanHtml;

  // 六地對照
  const locNames = LOCATIONS.map(l => l.name);
  let mainHtml = '';
  for (const dk of days) {
    mainHtml += `<div class="day-section">
      <div class="day-label">📅 ${getDayLabel(dk)}</div>
      ${makeTable(dk, COMPARE_HOURS, locNames, allData, currentDateKey, currentHour)}
    </div>`;
  }
  document.getElementById('mainContent').innerHTML = mainHtml;
}

async function fetchAll() {
  setLoading(true);
  setStatus('抓取氣象署資料中…');
  updateDateBadge();

  try {
    const [chiayi, yunlin] = await Promise.all([
      fetchCounty('F-D0047-029'),
      fetchCounty('F-D0047-025'),
    ]);

    const allData = {};
    for (const loc of LOCATIONS) {
      const countyData = loc.county === 'F-D0047-029' ? chiayi : yunlin;
      allData[loc.name] = parseLocationData(countyData, loc.town);
    }

    renderAll(allData);
    setStatus('✓ 資料已更新', 'ok');
  } catch(e) {
    setStatus('⚠ 抓取失敗，請重試', 'error');
  }

  await updateAiReport();

  setLoading(false);
}

fetchAll();
</script>
</body>
</html>
